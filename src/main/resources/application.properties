spring.application.name=franquicias-api
spring.mongodb.uri=mongodb://localhost:27017/franquicias_db

# Diferir la creacion de beans singleton hasta su primer uso. Seguro aqui: no
# hay @Configuration/@Bean, @PostConstruct ni CommandLineRunner con efectos
# secundarios en el arranque -- solo casos de uso, repositorio reactivo y
# controller. Reduce el trabajo de refresh del contexto bajo CPU muy limitada
# (0.15 vCPU en Render) para que el puerto quede listo antes.
spring.main.lazy-initialization=true
